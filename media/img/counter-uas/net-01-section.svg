<path d="M282 520 q-44 52 4 100" class="thin"/>
<path d="M300 526 L288 588" stroke="#2f3a46" stroke-width="9" fill="none"/>
<rect x="288" y="482" width="52" height="14" rx="7" class="weight"/>
<!-- sight -->
<circle cx="1048" cy="300" r="24" fill="none" stroke="#2f3a46" stroke-width="5"/>
<path d="M1048 324 v12" class="thin"/>
<path d="M462 300 v42" stroke="#2f3a46" stroke-width="6" fill="none"/>
<!-- callouts -->
<path d="M640 273 V345 M1120 229 L1100 336 M962 273 V364 M740 273 V360 M860 229 L880 356 M498 273 V360 M560 229 L540 357 M420 229 L424 398 M300 273 L320 352 M195 692 L300 660 M195 522 L336 492 M195 552 L288 558 M195 440 L296 486 M1148 282 L1074 300" class="lead"/>
<g><circle cx="640" cy="258" r="15" class="tag"/><text x="640" y="264" class="tagn">1</text></g>
<g><circle cx="1120" cy="214" r="15" class="tag"/><text x="1120" y="220" class="tagn">2</text></g>
<g><circle cx="962" cy="258" r="15" class="tag"/><text x="962" y="264" class="tagn">3</text></g>
<g><circle cx="740" cy="258" r="15" class="tag"/><text x="740" y="264" class="tagn">4</text></g>
<g><circle cx="860" cy="214" r="15" class="tag"/><text x="860" y="220" class="tagn">5</text></g>
<g><circle cx="498" cy="258" r="15" class="tag"/><text x="498" y="264" class="tagn">6</text></g>
<g><circle cx="560" cy="214" r="15" class="tag"/><text x="560" y="220" class="tagn">7</text></g>
<g><circle cx="420" cy="214" r="15" class="tag"/><text x="420" y="220" class="tagn">8</text></g>
<g><circle cx="300" cy="258" r="15" class="tag"/><text x="300" y="264" class="tagn">9</text></g>
