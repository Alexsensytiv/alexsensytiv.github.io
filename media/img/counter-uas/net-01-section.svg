<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1200" viewBox="0 0 1780 1200">
<defs><style>
.bg{fill:#f5f7fa}
.title{font:700 40px Arial;fill:#1f2937}
.sub{font:21px Arial;fill:#64748b}
.h3{font:700 22px Arial;fill:#1f2937}
.leg{font:18px Arial;fill:#334155}
.cap{font:17px Arial;fill:#475569}
.capb{font:700 18px Arial;fill:#1f2937}
.body{fill:#dfe5ec;stroke:#3f4b59;stroke-width:4}
.bodycut{fill:#eef2f7;stroke:#5b6876;stroke-width:3}
.metal{fill:#9fb0c2;stroke:#2f3a46;stroke-width:3}
.gas{fill:#2b6cb0;stroke:#173f6b;stroke-width:3}
.weight{fill:#d6534d;stroke:#7d2b27;stroke-width:3}
.netfill{fill:#ffffff;stroke:#2b6cb0;stroke-width:3}
.netline{fill:none;stroke:#2b6cb0;stroke-width:2.5}
.sleeve{fill:none;stroke:#8b5cf6;stroke-width:3;stroke-dasharray:9 6}
.thin{fill:none;stroke:#526171;stroke-width:4}
.lead{fill:none;stroke:#8494a6;stroke-width:2}
.tag{fill:#2b6cb0}
.tagn{font:700 16px Arial;fill:#fff;text-anchor:middle}
.frame{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.rotor{fill:none;stroke:#1f2937;stroke-width:3}
.droneb{fill:#3f4b59;stroke:#1f2937;stroke-width:3}
.arrow{stroke:#2b6cb0;stroke-width:4;marker-end:url(#ah)}
.hot{stroke:#d6534d;stroke-width:4;marker-end:url(#ar)}
</style>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b6cb0"/></marker>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d6534d"/></marker>
</defs>
<rect width="1780" height="1200" class="bg"/>
<text x="60" y="62" class="title">NET-01 · Миниатюрная пусковая сетки против дрона</text>
<text x="60" y="100" class="sub">Разрез. Одноразовое исполнение, 1–2 баллона CO2 12 г, сетка 2×2 м, дальность раскрытия 3.5–8 м</text>
<line x1="60" y1="122" x2="1720" y2="122" stroke="#cbd5e1" stroke-width="2"/>

<!-- receiver -->
<rect x="280" y="330" width="152" height="148" rx="12" class="body"/>
<rect x="300" y="352" width="112" height="104" rx="8" class="metal"/>
<!-- barrel -->
<rect x="430" y="345" width="580" height="118" rx="8" class="body"/>
<rect x="437" y="357" width="566" height="94" rx="4" class="bodycut"/>
<!-- muzzle cap -->
<rect x="1000" y="336" width="96" height="136" rx="10" class="body"/>
<path d="M1096 358 L1156 316 M1096 380 L1156 352 M1096 428 L1156 456 M1096 450 L1156 492" class="thin"/>
<!-- retention lip -->
<path d="M536 357 v20 M536 451 v-20" stroke="#2f3a46" stroke-width="7" fill="none"/>
<!-- sabot -->
<rect x="470" y="360" width="56" height="88" rx="5" class="metal"/>
<circle cx="470" cy="368" r="7" class="gas"/><circle cx="470" cy="440" r="7" class="gas"/>
