<rect x="546" y="360" width="386" height="88" rx="4" class="netfill"/>
<path d="M556 360 l20 88 M596 360 l20 88 M636 360 l20 88 M676 360 l20 88 M716 360 l20 88 M756 360 l20 88 M796 360 l20 88 M836 360 l20 88 M876 360 l20 88 M916 360 l16 70" class="netline"/>
<rect x="542" y="356" width="394" height="96" rx="6" class="sleeve"/>
<!-- weights in muzzle channels -->
<circle cx="962" cy="378" r="14" class="weight"/><circle cx="962" cy="430" r="14" class="weight"/>
<circle cx="1040" cy="372" r="14" class="weight"/><circle cx="1040" cy="436" r="14" class="weight"/>
<!-- orifice + gas path -->
<path d="M412 404 H470" class="hot"/>
<!-- grip -->
<path d="M282 478 H430 L406 812 H272 Z" class="body"/>
<rect x="300" y="512" width="34" height="182" rx="17" class="gas"/>
<rect x="344" y="512" width="34" height="182" rx="17" class="gas"/>
<rect x="310" y="496" width="14" height="18" class="metal"/><rect x="354" y="496" width="14" height="18" class="metal"/>
