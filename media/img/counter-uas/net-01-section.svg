<circle cx="1262" cy="1000" r="13" class="rotor"/><circle cx="1358" cy="1000" r="13" class="rotor"/>
<circle cx="1262" cy="1060" r="13" class="rotor"/><circle cx="1358" cy="1060" r="13" class="rotor"/>
</svg>
