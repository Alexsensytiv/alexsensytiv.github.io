<g><circle cx="180" cy="552" r="15" class="tag"/><text x="180" y="558" class="tagn">12</text></g>
<g><circle cx="180" cy="440" r="15" class="tag"/><text x="180" y="446" class="tagn">13</text></g>
<g><circle cx="1160" cy="272" r="15" class="tag"/><text x="1160" y="278" class="tagn">14</text></g>
<!-- legend -->
<text x="1200" y="196" class="h3">Состав</text>
<text x="1200" y="234" class="leg">1 · Ствол Ø48×220, PETG или PA12-CF, стенка 3.5 мм</text>
<text x="1200" y="272" class="leg">2 · Дульная насадка, 4 разгонных скоса 22°, съёмная</text>
<text x="1200" y="310" class="leg">3 · Грузики 4×22 г в каналах насадки, носок TPU</text>
<text x="1200" y="348" class="leg">4 · Пакет сетки 2×2 м, Z-укладка, ячейка 50 мм</text>
<text x="1200" y="386" class="leg">5 · Легкоразрывной чехол, PE 0.35 мм, перфорация</text>
<text x="1200" y="424" class="leg">6 · Сабо-толкатель 15 г с манжетой O-ring</text>
<text x="1200" y="462" class="leg">7 · Удерживающий буртик: срыв при 4 ± 0.5 бар</text>
<text x="1200" y="500" class="leg">8 · Сопло Ø3.5 мм в дно ствола</text>
<text x="1200" y="538" class="leg">9 · Ресивер: алюминиевая гильза + мембрана 15 бар</text>
<text x="1200" y="576" class="leg">10 · Баллон CO2 12 г ×2, второй — холод и резерв</text>
<text x="1200" y="614" class="leg">11 · Пробойник Ø4 с возвратной пружиной</text>
<text x="1200" y="652" class="leg">12 · Спуск: крючок, сеар из стали 1.5 мм, ось</text>
<text x="1200" y="690" class="leg">13 · Предохранительная чека с красным флажком</text>
<text x="1200" y="728" class="leg">14 · Кольцевой прицел Ø50 на базе 150 мм</text>
<text x="1200" y="778" class="cap">Красная стрелка — путь газа от баллона</text>
<text x="1200" y="804" class="cap">через сопло 8 в заснарядное пространство.</text>
<text x="60" y="856" class="h3">Раскрытие: три фазы</text>
<rect x="60" y="872" width="460" height="300" rx="14" class="frame"/>
<rect x="570" y="872" width="460" height="300" rx="14" class="frame"/>
<rect x="1080" y="872" width="460" height="300" rx="14" class="frame"/>
<text x="84" y="906" class="capb">1 · t = 0…20 мс, путь 0…0.2 м</text>
<text x="594" y="906" class="capb">2 · t ≈ 60 мс, дальность ≈ 1.3 м</text>
<text x="1104" y="906" class="capb">3 · t ≈ 160 мс, дальность ≈ 3.5 м</text>
<text x="84" y="1152" class="cap">Сабо разгоняет пакет до 22 м/с, чехол цел</text>
<text x="594" y="1152" class="cap">Чехол рвётся, грузики расходятся по конусу 22°</text>
<text x="1104" y="1152" class="cap">Сетка 2×2 м раскрыта и накрывает дрон</text>
